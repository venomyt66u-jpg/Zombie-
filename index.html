<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOMBIE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
/* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    outline:none !important;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}
*:focus,
*:active{
    outline:none !important;
    box-shadow:none !important;
}

/* اخفاء أي Play افتراضي */
video::-webkit-media-controls,
video::-webkit-media-controls-overlay-play-button,
video::-webkit-media-controls-start-playback-button,
video::-webkit-media-controls-play-button,
video::-webkit-media-controls-enclosure{
    display:none !important;
}

/* ===== BODY ===== */
body{
    background:#000;
    color:#fff;
    height:100vh;
    display:flex;
    flex-direction:column;
    font-family:'Creepster', cursive;
}

/* ===== TOP BAR ===== */
.top-bar{
    height:55px;
    display:flex;
    align-items:center;
    padding:0 15px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.top-left{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.top-left img{
    height:24px;
}

.top-left span{
    font-size:16px;
    letter-spacing:2px;
}

/* Glitch */
.glitch{
    animation:glitch .35s linear infinite;
}
@keyframes glitch{
    0%{transform:translate(0)}
    20%{transform:translate(-2px,1px)}
    40%{transform:translate(2px,-1px)}
    60%{transform:translate(-1px,2px)}
    80%{transform:translate(1px,-2px)}
    100%{transform:translate(0)}
}

/* ===== CENTER ===== */
.center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    gap:18px;
}

.tv-wrapper{
    width:100%;
    max-width:360px;
    aspect-ratio:9/16;
    overflow:hidden;
    background:#000;
    cursor:pointer;
    animation:breathe 6s ease-in-out infinite;
}

@keyframes breathe{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.01)}
}

.tv-wrapper video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
    pointer-events:none;
}

/* ===== COMING SOON ===== */
.coming-soon{
    font-size:13px;
    letter-spacing:2px;
    opacity:.6;
    animation:flicker 3s infinite;
}

@keyframes flicker{
    0%,100%{opacity:.6}
    50%{opacity:.85}
}

/* ===== BOTTOM ===== */
.bottom-icons{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-top:1px solid rgba(255,255,255,.05);
}

.bottom-icons a{
    color:#fff;
    font-size:22px;
    opacity:.7;
    transition:.4s;
    animation:pulse 2.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);opacity:.6}
    50%{transform:scale(1.15);opacity:1}
    100%{transform:scale(1);opacity:.6}
}

.bottom-icons a:hover{
    opacity:1;
    transform:scale(1.25) rotate(-5deg);
}
</style>
</head>

<body>

<!-- TOP -->
<div class="top-bar">
    <div class="top-left" onclick="glitchLogo()">
        <img src="logo.png" id="logo">
        <span>ZOMBIE</span>
    </div>
</div>

<!-- CENTER -->
<div class="center">
    <div class="tv-wrapper" onclick="startVideo()">
        <video
            id="video"
            src="vid.mp4"
            muted
            playsinline
            preload="auto">
        </video>
    </div>

    <div class="coming-soon">
        FINAL SITE — COMING SOON
    </div>
</div>

<!-- BOTTOM -->
<div class="bottom-icons">
    <a href="https://x.com/zombie_On_base" target="_blank" aria-label="Zombie on X">
        <i class="fa-brands fa-x-twitter"></i>
    </a>
</div>

<script>
const video = document.getElementById("video");
const logo  = document.getElementById("logo");
let started = false;

/* تثبيت الفيديو عند 0.6 ثانية */
video.addEventListener("loadedmetadata", () => {
    video.currentTime = 0.6;
    video.pause();
});

/* منع أي تشغيل تلقائي */
video.addEventListener("timeupdate", () => {
    if(!started && video.currentTime > 0.65){
        video.pause();
        video.currentTime = 0.6;
    }
});

/* تشغيل عند أول تفاعل */
function startVideo(){
    if(started) return;
    started = true;
    video.muted = false;
    video.play();
}

/* Glitch Logo */
function glitchLogo(){
    logo.classList.add("glitch");
    setTimeout(()=>logo.classList.remove("glitch"), 700);
}
</script>

</body>
</html>
