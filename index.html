<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOMBIEE | PERFECT RESPONSIVE</title>
    
    <link href="https://fonts.cdnfonts.com/css/monument-extended" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root { 
            --accent: #bcff00; --bg: #000; --text: #fff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --font: 'Monument Extended', sans-serif; 
        }

        /* White Mode - خلفية بيضاء بالكامل */
        body.white-mode {
            --bg: #ffffff; --text: #000; --accent: #ff0055;
            --card-bg: rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--bg); color: var(--text); 
            font-family: var(--font), sans-serif; 
            overflow-x: hidden; transition: background 0.6s ease, color 0.6s ease;
        }

        #fragment-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(5px); opacity: 0.3; }

        .top-nav {
            position: fixed; top: 0; width: 100%; height: 45px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 10000; background: var(--accent); color: #000;
            font-weight: 900; font-size: 0.6rem; letter-spacing: 2px;
        }

        .mode-switch {
            background: #000; color: #fff; border: none; padding: 5px 12px;
            border-radius: 4px; cursor: pointer; font-family: var(--font); font-size: 0.5rem;
        }
        body.white-mode .mode-switch { background: #fff; color: #000; }

        section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px 5%; width: 100%; }

        /* Hero Text - تعديل الحجم للموبايل */
        .hero-title { 
            font-size: clamp(2.8rem, 13vw, 10rem); /* صغرت الحد الأدنى من 3.5 لـ 2.8 */
            line-height: 0.85; text-align: center; cursor: pointer; 
        }

        .data-grid {
            display: none; width: 100%; max-width: 900px;
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; margin-top: 40px;
        }

        @media (min-width: 768px) {
            .data-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
            #social-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .item-card {
            padding: 25px 15px; background: var(--card-bg); 
            border: 1px solid rgba(128, 128, 128, 0.2);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 0.5s; opacity: 0; transform: translateY(20px);
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            text-decoration: none; color: inherit;
        }

        .item-card.active { opacity: 1; transform: translateY(0); border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }
        .label { font-size: 0.45rem; color: var(--accent); margin-bottom: 8px; }
        .val { font-size: 0.85rem; font-weight: bold; }

        .art-viewport { position: relative; width: clamp(250px, 40vw, 400px); aspect-ratio: 3/4; perspective: 1000px; }
        .art-card { position: absolute; inset: 0; border: 2px solid var(--accent); border-radius: 20px; overflow: hidden; background: #000; }
        .art-card img { width: 100%; height: 100%; object-fit: cover; }

        .letter { display: inline-block; }
    </style>
</head>
<body>

    <canvas id="fragment-canvas"></canvas>

    <div class="top-nav">
        <div id="countdown">MINT LIVE IN: 00:00:00</div>
        <button class="mode-switch" onclick="toggleMode()">WHITE MODE</button>
    </div>

    <audio id="sfx-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <section>
        <div class="hero-title" onclick="destructText(this)">
            <h1>DONT</h1>
            <h1>SLEEP</h1>
        </div>
    </section>

    <section id="art-sec">
        <div class="art-viewport">
            <div class="art-card" style="z-index: 3;"><img src="nft3.png"></div>
            <div class="art-card" style="z-index: 2;"><img src="nft2.png"></div>
            <div class="art-card" style="z-index: 1;"><img src="nft1.png"></div>
        </div>
    </section>

    <section>
        <div onclick="showGrid('mint-grid')" style="cursor:pointer;"><h1>MINT INFO</h1></div>
        <div class="data-grid" id="mint-grid">
            <div class="item-card"><span class="label">SUPPLY</span><span class="val">2,222</span></div>
            <div class="item-card"><span class="label">GUARANTEED</span><span class="val">FREE</span></div>
            <div class="item-card"><span class="label">FCFS</span><span class="val">0.0004</span></div>
            <div class="item-card"><span class="label">PUBLIC</span><span class="val">0.00089</span></div>
        </div>
    </section>

    <section>
        <div onclick="showGrid('social-grid')" style="cursor:pointer;"><h1>JOIN US</h1></div>
        <div class="data-grid" id="social-grid">
            <a href="https://opensea.io/collection/zombieeonbase/overview" target="_blank" class="item-card">
                <i class="fa-solid fa-ship" style="font-size: 1.3rem;"></i>
                <span class="val">OPENSEA</span>
            </a>
            <a href="https://x.com/zombie_On_base" target="_blank" class="item-card">
                <i class="fa-brands fa-x-twitter" style="font-size: 1.3rem;"></i>
                <span class="val">X / TWITTER</span>
            </a>
            <a href="#" class="item-card">
                <i class="fa-solid fa-globe" style="font-size: 1.3rem;"></i>
                <span class="val">WEBSITE</span>
            </a>
        </div>
    </section>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        function updateTimer() {
            const now = new Date();
            const target = new Date();
            target.setHours(18, 0, 0, 0);
            if (now > target) target.setDate(target.getDate() + 1);
            const diff = target - now;
            const h = Math.floor(diff/3600000).toString().padStart(2,'0');
            const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
            document.getElementById('countdown').innerText = `MINT LIVE IN: ${h}:${m}:${s}`;
        }
        setInterval(updateTimer, 1000);

        function toggleMode() {
            document.body.classList.toggle('white-mode');
            const btn = document.querySelector('.mode-switch');
            btn.innerText = document.body.classList.contains('white-mode') ? "DARK MODE" : "WHITE MODE";
        }

        function showGrid(id) {
            const g = document.getElementById(id);
            const cards = g.querySelectorAll('.item-card');
            if(getComputedStyle(g).display === 'none') {
                g.style.display = 'grid';
                cards.forEach((c, i) => setTimeout(() => c.classList.add('active'), i * 150));
            } else {
                cards.forEach(c => c.classList.remove('active'));
                setTimeout(() => g.style.display = 'none', 500);
            }
        }

        const canvas = document.getElementById('fragment-canvas');
        const ctx = canvas.getContext('2d');
        let parts = [];
        const logo = new Image(); logo.src = 'logo.png';
        function initBG() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            parts = Array.from({length: 20}, () => ({
                x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                s: Math.random()*15+10, vy: Math.random()*0.15 + 0.05
            }));
        }
        function drawBG() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            parts.forEach(p => {
                p.y -= p.vy; if(p.y < -50) p.y = canvas.height + 50;
                ctx.globalAlpha = 0.12; ctx.drawImage(logo, p.x, p.y, p.s, p.s);
            });
            requestAnimationFrame(drawBG);
        }
        logo.onload = () => { initBG(); drawBG(); };

        function destructText(el) {
            const txt = el.querySelector('h1') || el;
            if(!txt.querySelector('.letter')) {
                txt.innerHTML = txt.innerText.split('').map(c => `<span class="letter">${c}</span>`).join('');
            }
            const letters = txt.querySelectorAll('.letter');
            gsap.timeline()
                .to(letters, { x: () => gsap.utils.random(-250, 250), y: () => gsap.utils.random(-250, 250), opacity: 0, duration: 0.5 })
                .to(letters, { x: 0, y: 0, opacity: 1, duration: 0.7, stagger: 0.02, ease: "back.out(2)" });
        }

        gsap.utils.toArray(".art-card").forEach((card, i) => {
            gsap.to(card, {
                scrollTrigger: { trigger: "#art-sec", start: "top 20%", end: "bottom top", scrub: 1 },
                x: (i - 1) * (window.innerWidth < 768 ? 250 : 350), 
                rotation: (i - 1) * 20, 
                opacity: 0
            });
        });
    </script>
</body>
</html>
