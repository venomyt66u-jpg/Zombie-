<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTD | THE GATEKEEPER</title>

    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Outfit:wght@300;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg:#030303;--main:#ffffff;--red:#ff3e3e;--glass:rgba(255,255,255,.03);
        }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{
            background:var(--bg);color:var(--main);font-family:'Outfit',sans-serif;
            min-height:100vh;display:flex;justify-content:center;align-items:center
        }
        .page{display:none;width:95%;max-width:600px;text-align:center;padding:20px}
        .active-page{display:block}
        .logo-img{width:160px}
        .checker-box{background:var(--glass);padding:40px 20px;border-radius:40px}
        .wallet-input{
            width:100%;padding:22px;border-radius:20px;
            background:#000;border:1px solid rgba(255,255,255,.1);
            color:#fff;text-align:center;font-weight:700
        }
        .btn-scan{
            width:100%;padding:22px;border-radius:20px;
            background:#fff;color:#000;font-family:'Unbounded';
            font-weight:900;border:none;cursor:pointer;margin-top:15px
        }
        .tiers{display:flex;gap:10px;margin-top:30px}
        .t-card{
            flex:1;padding:20px;background:var(--glass);
            border-radius:20px;opacity:.15;transition:.3s
        }
        .t-card.active{
            opacity:1;border:1px solid #fff;box-shadow:0 0 15px #fff
        }
        #resultText{margin-top:20px;font-family:'Unbounded';font-size:12px}
    </style>
</head>
<body>

<div id="checkerPage" class="page active-page">
    <img src="logo.png" class="logo-img"><br><br>

    <div class="checker-box">
        <input id="walletInput" class="wallet-input" placeholder="PASTE ADDRESS (0x...)">
        <button class="btn-scan" onclick="checkEligibility()">SCAN DATA</button>

        <div id="resultText"></div>

        <div class="tiers">
            <div class="t-card" id="t-gtd"><b>GTD</b></div>
            <div class="t-card" id="t-fcfs"><b>FCFS</b></div>
            <div class="t-card" id="t-pub"><b>PUBLIC</b></div>
        </div>
    </div>
</div>

<script>
/* ========= DATABASE LOGIC ========= */

async function fetchCSV(file) {
    try {
        const res = await fetch(file);
        const text = await res.text();
        return text
            .toLowerCase()
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(Boolean);
    } catch {
        return [];
    }
}

let GTD_LIST = [];
let FCFS_LIST = [];

(async function preload() {
    const [gtd30, gtd40, fcfs] = await Promise.all([
        fetchCSV('GTD30.csv'),
        fetchCSV('GTD40.csv'),
        fetchCSV('FCFS.csv')
    ]);

    GTD_LIST = [...new Set([...gtd30, ...gtd40])];
    FCFS_LIST = [...new Set(fcfs)];
})();

async function checkEligibility() {
    const addr = document.getElementById('walletInput').value.trim().toLowerCase();
    const result = document.getElementById('resultText');

    document.querySelectorAll('.t-card').forEach(c => c.classList.remove('active'));

    if (!addr) return;

    if (GTD_LIST.includes(addr)) {
        document.getElementById('t-gtd').classList.add('active');
        result.innerHTML = "WELCOME KING. <b>GTD CONFIRMED.</b>";
    }
    else if (FCFS_LIST.includes(addr)) {
        document.getElementById('t-fcfs').classList.add('active');
        result.innerHTML = "YOU'RE IN. <b>FCFS CONFIRMED.</b>";
    }
    else {
        document.getElementById('t-pub').classList.add('active');
        result.innerHTML = "<span style='color:#ff3e3e'>NOT ELIGIBLE.</span>";
    }
}
</script>

</body>
</html>
