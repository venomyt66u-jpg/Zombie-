<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOMBIE | WL ACCESS</title>

<style>
:root{--bg:#000;--main:#fff;--secondary:#0a0a0a;--border:#222;--green:#00ff66;}
*{box-sizing:border-box;font-family:'JetBrains Mono','Courier New',monospace}
body{margin:0;background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
.rain{position:fixed;inset:0;pointer-events:none;z-index:0}
.drop{position:absolute;top:-80px;width:40px;opacity:.06;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(120vh)}}
.container{width:100%;max-width:400px;padding:40px 30px;border:1px solid #222;background:#0a0a0a;text-align:center;z-index:2}
.logo{width:70px;margin-bottom:25px;opacity:.85}
.step{display:none}
.step.active{display:block}
input{width:100%;background:#000;border:1px solid #222;padding:16px;color:#fff;margin-bottom:20px}
button{width:100%;padding:16px;background:#fff;color:#000;border:none;font-weight:800;cursor:pointer;display:none}
button.show{display:block}
.task{display:flex;justify-content:space-between;align-items:center;background:#000;border:1px solid #222;padding:14px;margin-bottom:12px;cursor:pointer}
.task.done{opacity:.5;border-color:#00ff66}
.task.done::after{content:"✓";color:#00ff66}
.loader{width:16px;height:16px;border:2px solid #333;border-top:2px solid #00ff66;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div class="rain" id="rain"></div>

<div class="container" id="app">
<img src="logo.png" class="logo">

<div class="step" id="s1">
<h2>IDENTIFY</h2>
<input id="twitter" placeholder="@username">
<button id="b1">CONTINUE</button>
</div>

<div class="step" id="s2">
<h2>VERIFY</h2>
<div class="task" data-id="t1" data-url="https://x.com/zombie_On_base">FOLLOW PROJECT <span></span></div>
<div class="task" data-id="t2" data-url="https://x.com/Venom_w8t">FOLLOW ARTIST <span></span></div>
<button id="b2">NEXT</button>
</div>

<div class="step" id="s3">
<h2>ENGAGE 1</h2>
<div class="task" data-id="t3" data-url="https://x.com/i/status/2018804231768289470">LIKE, RT & COMMENT <span></span></div>
<input id="comment1" placeholder="Paste comment link" style="display:none">
<button id="b3">NEXT</button>
</div>

<div class="step" id="s4">
<h2>ENGAGE 2</h2>
<div class="task" data-id="t4" data-url="https://x.com/i/status/2018988534942892171">LIKE, RT & COMMENT <span></span></div>
<input id="comment2" placeholder="Paste comment link" style="display:none">
<button id="b4">NEXT</button>
</div>

<div class="step" id="s5">
<h2>ENGAGE 3</h2>
<div class="task" data-id="t5" data-url="https://x.com/i/status/2019085978464379155">LIKE, RT & COMMENT <span></span></div>
<input id="comment3" placeholder="Paste comment link" style="display:none">
<button id="b5">NEXT</button>
</div>

<div class="step" id="s6">
<h2>WALLET</h2>
<input id="wallet" placeholder="0x...">
<button id="b6">GET WL</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyBIgHnPUl4aAL7SwRjYCes0gPH-jNFBvs0",
 authDomain:"zombie-e4324.firebaseapp.com",
 projectId:"zombie-e4324"
});
const db=firebase.firestore();

/* RAIN */
for(let i=0;i<20;i++){
 const d=document.createElement("img");
 d.src="logo.png"; d.className="drop";
 d.style.left=Math.random()*100+"%";
 d.style.animationDuration=5+Math.random()*8+"s";
 rain.appendChild(d);
}

/* STATE */
let state = JSON.parse(localStorage.getItem("zombie_progress")) || {
 step:1, done:{}, twitter:"", c1:"", c2:"", c3:""
};

const save = () => localStorage.setItem("zombie_progress", JSON.stringify(state));

const show = i => {
 document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
 document.getElementById("s"+i).classList.add("active");
 state.step=i; save();
};

/* RESTORE */
show(state.step);
twitter.value=state.twitter;
comment1.value=state.c1;
comment2.value=state.c2;
comment3.value=state.c3;

document.querySelectorAll(".task").forEach(t=>{
 if(state.done[t.dataset.id]) t.classList.add("done");
});

/* INPUTS */
twitter.oninput=()=>{state.twitter=twitter.value;save();b1.classList.toggle("show",twitter.value.length>3)};
comment1.oninput=()=>{state.c1=comment1.value;save();b3.classList.toggle("show",comment1.value.includes("x.com"))};
comment2.oninput=()=>{state.c2=comment2.value;save();b4.classList.toggle("show",comment2.value.includes("x.com"))};
comment3.oninput=()=>{state.c3=comment3.value;save();b5.classList.toggle("show",comment3.value.includes("x.com"))};
wallet.oninput=()=>b6.classList.toggle("show",wallet.value.length>30);

/* NAV */
b1.onclick=()=>show(2);
b2.onclick=()=>show(3);
b3.onclick=()=>show(4);
b4.onclick=()=>show(5);
b5.onclick=()=>show(6);

/* TASKS */
document.querySelectorAll(".task").forEach(t=>{
 t.onclick=()=>{
  if(t.classList.contains("done"))return;
  t.querySelector("span").innerHTML='<div class="loader"></div>';
  setTimeout(()=>{
   t.classList.add("done");
   state.done[t.dataset.id]=true;
   save();
   t.querySelector("span").innerHTML="";
   if(t.dataset.id==="t3")comment1.style.display="block";
   if(t.dataset.id==="t4")comment2.style.display="block";
   if(t.dataset.id==="t5")comment3.style.display="block";
   if(document.querySelectorAll("#s2 .task.done").length===2)b2.classList.add("show");
   window.open(t.dataset.url,"_blank");
  },1000);
 }
});

/* FINAL */
b6.onclick=async()=>{
 await db.collection("whitelist").add({
  twitter:twitter.value,
  wallet:wallet.value,
  c1:comment1.value,
  c2:comment2.value,
  c3:comment3.value,
  createdAt:new Date()
 });
 localStorage.clear();
 localStorage.setItem("zombie_done","true");
 app.innerHTML="<h2>SUCCESS</h2><p>YOU ARE WHITELISTED.</p>";
};
</script>

</body>
</html>
