<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOMBIE | WL ACCESS</title>

<style>
:root{
    --bg:#000;--main:#fff;--secondary:#0a0a0a;
    --border:#222;--text-muted:#777;
}
*{box-sizing:border-box;font-family:'JetBrains Mono','Courier New',monospace}
body{
    margin:0;background:var(--bg);color:var(--main);
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;
}
.container{
    width:100%;max-width:400px;padding:40px 30px;
    text-align:center;border:1px solid var(--border);
    background:var(--secondary);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.logo{width:65px;filter:brightness(2);margin-bottom:25px}

.step-content{display:none;animation:fade .4s ease}
.step-content.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}

h2{font-size:1.4rem;letter-spacing:1px;margin-bottom:8px}
p{color:var(--text-muted);font-size:.85rem;margin-bottom:30px}

input{
    width:100%;background:#000;border:1px solid var(--border);
    padding:16px;color:#fff;margin-bottom:20px
}
input:focus{border-color:#fff;outline:none}

.task-item{
    background:#000;border:1px solid var(--border);
    padding:16px;margin-bottom:12px;
    display:flex;justify-content:space-between;
    color:#fff;text-decoration:none;font-size:.85rem
}
.task-item.completed{opacity:.4;pointer-events:none}
.task-item.completed span{color:#0f0}

button{
    width:100%;background:#fff;color:#000;
    border:none;padding:16px;font-weight:800;
    display:none;cursor:pointer
}
button.visible{display:block}
</style>
</head>

<body>

<div class="container" id="app">
<img src="logo.png" class="logo">

<div class="step-content active" id="step1">
    <h2>IDENTIFY</h2>
    <p>ENTER YOUR X HANDLE</p>
    <input id="twitterInput" placeholder="@username" oninput="validateStep1()">
    <button id="btn1" onclick="next(2)">CONTINUE</button>
</div>

<div class="step-content" id="step2">
    <h2>VERIFY</h2>
    <p>FOLLOW COMMANDS</p>
    <a class="task-item" href="https://x.com/zombie_On_base" target="_blank" onclick="markTask(this,'t1')">
        FOLLOW PROJECT <span>[LINK]</span>
    </a>
    <a class="task-item" href="https://x.com/Venom_w8t" target="_blank" onclick="markTask(this,'t2')">
        FOLLOW ARTIST <span>[LINK]</span>
    </a>
    <button id="btn2" onclick="next(3)">NEXT</button>
</div>

<div class="step-content" id="step3">
    <h2>ENGAGE</h2>
    <p>LIKE & RT</p>
    <a class="task-item" href="#" onclick="markTask(this,'t3')">
        LIKE & RT <span>[LINK]</span>
    </a>
    <button id="btn3" onclick="next(4)">FINAL</button>
</div>

<div class="step-content" id="step4">
    <h2>SUBMIT WALLET</h2>
    <p>ENTER YOUR BASE ADDRESS</p>
    <input id="walletInput" placeholder="0x..." oninput="validateStep4()">
    <button id="btn4" onclick="finalSubmit()">GET WHITELISTED</button>
</div>
</div>

<!-- LOGIC -->
<script>
window.onload=()=>{
    if(localStorage.getItem('zombie_wl')==='true'){
        app.innerHTML=`
            <img src="logo.png" class="logo">
            <h2 style="color:#ff3333">ALREADY REGISTERED</h2>
            <p>ONE WALLET PER SURVIVOR</p>`;
    }
}

let progress={t1:false,t2:false,t3:false};

function validateStep1(){
    btn1.classList.toggle('visible',
        twitterInput.value.startsWith('@') && twitterInput.value.length>3);
}
function validateStep4(){
    btn4.classList.toggle('visible',
        walletInput.value.startsWith('0x') && walletInput.value.length>30);
}
function markTask(el,id){
    el.classList.add('completed');
    el.querySelector('span').innerText='[DONE]';
    progress[id]=true;
    if(progress.t1&&progress.t2)btn2.classList.add('visible');
    if(progress.t3)btn3.classList.add('visible');
}
function next(step){
    document.querySelectorAll('.step-content').forEach(s=>s.classList.remove('active'));
    document.getElementById('step'+step).classList.add('active');
}
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBIgHnPUl4aAL7SwRjYCes0gPH-jNFBvs0",
  authDomain:"zombie-e4324.firebaseapp.com",
  projectId:"zombie-e4324",
  storageBucket:"zombie-e4324.firebasestorage.app",
  messagingSenderId:"874798974551",
  appId:"1:874798974551:web:baf94cb8571a641941c512"
};

const appFB=initializeApp(firebaseConfig);
const db=getFirestore(appFB);

window.finalSubmit=async()=>{
    await addDoc(collection(db,"whitelist"),{
        twitter:twitterInput.value,
        wallet:walletInput.value,
        tasks:progress,
        createdAt:new Date()
    });

    localStorage.setItem('zombie_wl','true');

    app.innerHTML=`
        <img src="logo.png" class="logo">
        <h2>SUBMISSION RECEIVED</h2>
        <p>YOU ARE IN. LFG.</p>`;
};
</script>

</body>
</html>
